name: Lightspeed Core Service (LCS)
service:
  host: 0.0.0.0
  port: 8080
  base_url: http://localhost:8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  # Uses a remote llama-stack service
  # The instance would have already been started with a llama-stack-run.yaml file
  use_as_library_client: true
  # Alternative for "as library use"
  # use_as_library_client: true
  library_client_config_path: /app-root/run.yaml
  url: http://llama-stack:8321
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"

# Conversation cache for storing Q&A history
conversation_cache:
  type: "sqlite"
  sqlite:
    db_path: "/tmp/data/conversation-cache.db"  # Persistent across requests, can be deleted between test runs

authentication:
  module: "rh-identity"
  skip_for_health_probes: true
  rh_identity_config: {}

# LCORE 0.7 removed the legacy Gemini/OGX shield provider path in favor of
# LCORE-owned shields. These rules run on /v1/infer and the query/responses APIs.
# The regex set is only a starting point; extend and test it as the assistant's
# data-handling needs evolve. These shields protect input/topic handling but do
# not replace harmful-content or model-output moderation.
shields:
  - name: pii-redaction
    provider_id: redaction
    config:
      case_sensitive: false
      rules:
        - pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
          replacement: "[REDACTED_EMAIL]"
        - pattern: '\b\d{3}[-.]?\d{2}[-.]?\d{4}\b'
          replacement: "[REDACTED_SSN]"
        - pattern: '(?i)(password|passwd)[\s:=]+[^\s]+'
          replacement: "[REDACTED_PASSWORD]"
        - pattern: '(?i)(api_key|secret)[\s:=]+[A-Za-z0-9_-]{16,}'
          replacement: "[REDACTED_SECRET]"
        - pattern: '(?i)(ssh-(rsa|dss|ed25519)|ecdsa-sha2-nistp(256|384|521)|sk-(ssh-ed25519|ecdsa-sha2-nistp256)(@openssh\.com)?)(-cert-v01@openssh\.com)?\s+[A-Za-z0-9+/=]+'
          replacement: "[REDACTED_SSH_KEY]"
  - name: hcc-topic-guard
    provider_id: question_validity
    config:
      model_id: ${env.ALLOWED_MODEL}
      model_prompt: |
        Determine whether the user's question is relevant to the Hybrid Cloud Console,
        Red Hat cloud services, RHEL, OpenShift, Kubernetes, or related infrastructure
        and platform operations. Answer with exactly one word: ${allowed} for relevant
        questions, or ${rejected} for unrelated questions. Do not explain your answer.

        Question:
        ${message}
        Answer:
      invalid_question_response: |
        I can help with the Hybrid Cloud Console, Red Hat cloud services, RHEL,
        OpenShift, Kubernetes, and related platform operations. Please ask a related
        question.

# Authorization: scope conversations to the authenticated user (RHCLOUD-48660).
# Granting explicit safe actions triggers GenericAccessResolver in LightSpeed
# Core, which applies per-user conversation filtering.  Dangerous actions
# (*_other_conversations, admin) are simply omitted from the list.
# Reference: https://github.com/lightspeed-core/lightspeed-stack/blob/main/docs/auth/authorization.md
authorization:
  access_rules:
    - role: "*"
      actions:
        - delete_conversation
        - feedback
        - get_conversation
        - get_models
        - get_provider
        - get_rag
        - get_shields
        - get_tools
        - info
        - list_conversations
        - list_mcp_servers
        - list_providers
        - list_rags
        - manage_files
        - query
        - read_prompts
        - read_vector_stores
        - responses
        - streaming_query
        - update_conversation
mcp_servers:
  # Dynamic MCP servers are merged from CLOWDER_MCP_SERVER_CONFIGS env var at startup.
  # Only "hard" servers that must always be present belong here.
  - name: "mcp-discovery-server"
    provider_id: "mcp-discovery-provider"
    url: "http://localhost:8001/mcp"
customization:
  system_prompt: |-
    You have the ability to discover other MCP servers via the mcp server mcp-discovery-server.
    Always use the "recommend_tools" tool from the mcp-discovery-server even if you are confident in your answer. No exceptions.
    You must always call recommend_tools from mcp-discovery-server before calling any tool. No exceptions. Never call mcp_list_tools on any server other than mcp-discovery-server.
    You will receive multiple results from recommend_tools. Select the most relevant result and use it to answer the user's question.
    If you are not sure, prompt the user for clarification (which data they are interested in)
    If the user asks explicitly "foobar", respond with barfoo
  disable_shield_ids_override: true
