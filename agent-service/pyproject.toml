[project]
name = "hcc-test-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg2-binary>=2.9.9,<3",
    "pydantic-ai-slim[google]==2.71.0",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<0.29", "pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".."]